name: Build and package KHCOMRecomp Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/windows-ci-sdl2-build
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Initialize MSVC x64
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Build Release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\build.ps1 -Target KHCOMRecomp -Config Release
          if ($LASTEXITCODE -ne 0) { throw 'build.ps1 failed' }
          if (-not (Test-Path -LiteralPath 'build\Release\KHCOMRecomp.exe')) {
            throw 'Build did not produce build\Release\KHCOMRecomp.exe'
          }

      - name: Test
        shell: powershell
        run: |
          & python tests\test_runtime_functions.py
          if ($LASTEXITCODE -ne 0) { throw 'Runtime tests failed' }

      - name: Package Windows portable ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'KHCOMRecomp-Windows-x64'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Copy-Item -LiteralPath 'build\Release\KHCOMRecomp.exe' -Destination $dist
          $dllPaths = @(
            'build\Release\SDL2.dll',
            'third_party\sdl2\lib\x64\SDL2.dll',
            'SDL2.dll'
          )
          $dll = $dllPaths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $dll) { throw 'SDL2.dll missing: checked build, third_party, and repository root' }
          Copy-Item -LiteralPath $dll -Destination $dist

          foreach ($name in @('keybinds.ini', 'README.md', 'config', 'docs')) {
            if (Test-Path -LiteralPath $name) {
              Copy-Item -LiteralPath $name -Destination $dist -Recurse -Force
            } else {
              Write-Warning "Optional distribution item missing: $name"
            }
          }
          Compress-Archive -LiteralPath $dist -DestinationPath "$dist.zip" -CompressionLevel Optimal -Force
          if (-not (Test-Path -LiteralPath "$dist.zip")) { throw 'Distribution ZIP missing' }

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: KHCOMRecomp-Windows-x64
          path: KHCOMRecomp-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
